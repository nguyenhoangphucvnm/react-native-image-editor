compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# Limit hoisting to workspace boundaries so each workspace member gets its
# own node_modules folder with local symlinks.  This is required for:
#   1. React Native Metro — it resolves modules relative to the app root and
#      does not walk up to a monorepo root node_modules by default.
#   2. workspace:* protocol — with full hoisting, Yarn 4 may not create the
#      @phucprime/react-native-image-editor symlink that Example needs.
nmHoistingLimits: workspaces
